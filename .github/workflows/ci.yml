name: CI

on:
  push:
    branches: [device-management]
  pull_request:
    branches: [device-management]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests (non-blocking)
        run: npx ng test --watch=false --no-progress
        continue-on-error: true
