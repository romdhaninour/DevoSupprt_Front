
  <div class="w-full max-w-lg mx-auto">
    <!-- Glassmorphism Card -->
    <div class="relative backdrop-blur-xl bg-white/70 dark:bg-gray-800/70 rounded-3xl shadow-2xl border border-white/20 dark:border-gray-700/50 overflow-hidden">
      <!-- Decorative gradient border -->
      <div class="absolute inset-0 bg-gradient-to-r from-blue-500/20 via-purple-500/20 to-pink-500/20 opacity-50"></div>

      <div class="relative p-6 sm:p-7">
        <!-- Logo and Branding -->
        <div class="flex flex-col items-center mb-5">
          <div class="flex items-center gap-2 mb-2">
            <img
              src="/images/logo/DevoLgo.png"
              alt="DevoSupport"
              class="w-10 h-10 rounded-xl shadow-lg"
            />
            <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">DevoSupport</span>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">Content de te revoir</h1>
          <p class="text-sm text-gray-600 dark:text-gray-400 text-center">Connectez-vous pour accéder à votre tableau de bord</p>
        </div>

        <div *ngIf="message" class="mb-4 p-4 bg-gradient-to-r from-amber-50 to-orange-50 border-2 border-amber-300 rounded-xl dark:from-amber-900/30 dark:to-orange-900/30 dark:border-amber-600 shadow-lg">
          <div class="flex items-start gap-3">
            <div class="flex-shrink-0 p-1.5 bg-amber-100 rounded-full dark:bg-amber-800">
              <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
              </svg>
            </div>
            <div class="flex-1">
              <h3 class="font-semibold text-amber-900 dark:text-amber-200 mb-0.5 text-sm">Vérification du compte requise</h3>
              <p class="text-xs text-amber-800 dark:text-amber-300 leading-relaxed">{{ message }}</p>
            </div>
          </div>
        </div>

        <!-- Google Login Button -->
        <button (click)="signInWithGoogle()" class="group relative w-full flex items-center justify-center gap-3 py-3 text-sm font-semibold text-gray-700 transition-all duration-300 bg-white border-2 border-gray-200 rounded-xl hover:border-blue-500 hover:shadow-xl hover:shadow-blue-500/30 hover:-translate-y-0.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:hover:border-blue-400 dark:hover:shadow-blue-400/30 mb-4">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.7511 10.1944C18.7511 9.47495 18.6915 8.94995 18.5626 8.40552H10.1797V11.6527H15.1003C15.0011 12.4597 14.4654 13.675 13.2749 14.4916L13.2582 14.6003L15.9087 16.6126L16.0924 16.6305C17.7788 15.1041 18.7511 12.8583 18.7511 10.1944Z" fill="#4285F4"/>
            <path d="M10.1788 18.75C12.5895 18.75 14.6133 17.9722 16.0915 16.6305L13.274 14.4916C12.5201 15.0068 11.5081 15.3666 10.1788 15.3666C7.81773 15.3666 5.81379 13.8402 5.09944 11.7305L4.99473 11.7392L2.23868 13.8295L2.20264 13.9277C3.67087 16.786 6.68674 18.75 10.1788 18.75Z" fill="#34A853"/>
            <path d="M5.10014 11.7305C4.91165 11.186 4.80257 10.6027 4.80257 9.99992C4.80257 9.3971 4.91165 8.81379 5.09022 8.26935L5.08523 8.1534L2.29464 6.02954L2.20333 6.0721C1.5982 7.25823 1.25098 8.5902 1.25098 9.99992C1.25098 11.4096 1.5982 12.7415 2.20333 13.9277L5.10014 11.7305Z" fill="#FBBC05"/>
            <path d="M10.1789 4.63331C11.8554 4.63331 12.9864 5.34303 13.6312 5.93612L16.1511 3.525C14.6035 2.11528 12.5895 1.25 10.1789 1.25C6.68676 1.25 3.67088 3.21387 2.20264 6.07218L5.08953 8.26943C5.81381 6.15972 7.81776 4.63331 10.1789 4.63331Z" fill="#EB4335"/>
          </svg>
          <span>Continuer avec Google</span>
        </button>
      </div>
    </div>
  </div>
