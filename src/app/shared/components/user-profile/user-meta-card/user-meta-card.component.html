<div class="p-6 border border-gray-200 rounded-2xl dark:border-gray-800 bg-white dark:bg-gray-900/50 transition-all duration-300 hover:shadow-lg dark:hover:shadow-gray-900/50">
  <div class="flex flex-col items-center gap-6 sm:flex-row sm:items-start sm:gap-8">
    <!-- Avatar with role-colored ring -->
    <div class="relative group">
      <div class="w-24 h-24 sm:w-28 sm:h-28 overflow-hidden rounded-full border-4 {{ roleBadgeColors.ring }} ring-2 ring-offset-2 ring-offset-white dark:ring-offset-gray-900 transition-all duration-300 group-hover:scale-105 group-hover:shadow-lg">
        <img
          *ngIf="avatar"
          [src]="avatar"
          [alt]="displayName"
          class="w-full h-full object-cover"
        />
        <div
          *ngIf="!avatar"
          class="w-full h-full rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-3xl"
        >
          {{ initials }}
        </div>
      </div>
    </div>

    <!-- User Info -->
    <div class="flex-1 text-center sm:text-left">
      <h4 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">
        {{ displayName }}
      </h4>
      
      <div class="flex flex-col items-center gap-3 sm:flex-row sm:items-center sm:gap-4 mb-3">
        <!-- Role Badge -->
        <span 
          class="px-4 py-1.5 text-sm font-semibold rounded-full border {{ roleBadgeColors.bg }} {{ roleBadgeColors.text }} {{ roleBadgeColors.border }} transition-all duration-200"
        >
          {{ roleDisplayName }}
        </span>
        
        <div class="hidden h-4 w-px bg-gray-300 dark:bg-gray-700 sm:block"></div>
        
        <!-- Email -->
        <p class="text-sm text-gray-600 dark:text-gray-400">
          {{ user.email || '' }}
        </p>
      </div>
    </div>
  </div>
</div>
