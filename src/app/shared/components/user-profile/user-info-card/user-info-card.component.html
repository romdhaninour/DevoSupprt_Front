<div class="p-6 border border-gray-200 rounded-2xl dark:border-gray-800 bg-white dark:bg-gray-900/50 transition-all duration-300 hover:shadow-lg dark:hover:shadow-gray-900/50">
  <div class="flex flex-col gap-6">
    <div class="flex-1">
      <h4 class="text-xl font-semibold text-gray-900 dark:text-white/90 mb-6">
        Informations personnelles
      </h4>
      
      <!-- Icon-led Information Grid -->
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:gap-7">
        <!-- First Name -->
        <div class="flex items-start gap-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 transition-all duration-200 hover:bg-gray-100 dark:hover:bg-gray-800">
          <div class="flex-shrink-0 w-10 h-10 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-blue-600 dark:text-blue-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
              Prénom
            </p>
            <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">
              {{ user.prenom || '—' }}
            </p>
          </div>
        </div>

        <!-- Last Name -->
        <div class="flex items-start gap-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 transition-all duration-200 hover:bg-gray-100 dark:hover:bg-gray-800">
          <div class="flex-shrink-0 w-10 h-10 rounded-lg bg-purple-100 dark:bg-purple-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-purple-600 dark:text-purple-400" viewBox="0 0 20 20" fill="currentColor">
              <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
              Nom
            </p>
            <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">
              {{ user.nom || '—' }}
            </p>
          </div>
        </div>

        <!-- Email -->
        <div class="flex items-start gap-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 transition-all duration-200 hover:bg-gray-100 dark:hover:bg-gray-800">
          <div class="flex-shrink-0 w-10 h-10 rounded-lg bg-green-100 dark:bg-green-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-green-600 dark:text-green-400" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
              Adresse email
            </p>
            <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">
              {{ user.email || '—' }}
            </p>
          </div>
        </div>

        <!-- Role -->
        <div class="flex items-start gap-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 transition-all duration-200 hover:bg-gray-100 dark:hover:bg-gray-800">
          <div class="flex-shrink-0 w-10 h-10 rounded-lg bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
              Rôle
            </p>
            <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">
              {{ user.role || '—' }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
